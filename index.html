
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS vào HTML</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        h2 {
            color: blue;
        }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành nhúng CSS vào HTML</h1>

    <!-- Phần 1: Inline CSS -->
    <h2 style="color: red;">Phần 1: Inline CSS</h2>
    <p style="color: red;">
        Đây là đoạn văn được đổi màu bằng Inline CSS.
    </p>

    <!-- Phần 2: Internal CSS -->
    <h2>Phần 2: Internal CSS</h2>
    <p class="internal">
        Đây là đoạn văn được đổi màu bằng Internal CSS.
    </p>

    <!-- Phần 3: External CSS -->
    <h2>Phần 3: External CSS</h2>
    <p class="external">
        Đây là đoạn văn được đổi màu bằng External CSS.
    </p>
</body>
</html>
